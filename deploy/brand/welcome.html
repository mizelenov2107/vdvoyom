<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
  html,body{margin:0;width:1280px;height:720px;overflow:hidden}
  body{background:radial-gradient(120% 120% at 18% 10%,#4a2352 0%,#26132a 52%,#130a15 100%);color:#fff;font-family:Nunito,system-ui,sans-serif;position:relative}
  .glow{position:absolute;left:120px;top:120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,79,139,.38),rgba(180,79,255,.1) 60%,transparent 72%)}
  .heart{position:absolute;left:150px;top:170px;width:440px;height:440px}
  .text{position:absolute;left:640px;top:150px;right:80px}
  h1{font-family:Lora,Georgia,serif;font-size:112px;line-height:1;margin:0 0 22px;letter-spacing:-.02em}
  p{font-size:34px;line-height:1.3;margin:0 0 40px;color:#e9dcef;font-weight:600}
  .chips{display:flex;flex-direction:column;gap:14px}
  .chip{display:inline-flex;align-items:center;gap:14px;font-size:29px;font-weight:800;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:12px 24px;width:max-content}
</style>
<div class="glow"></div>
<svg class="heart" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#a996ff"/><stop offset="1" stop-color="#6a4bff"/></linearGradient>
    <linearGradient id="r" x1="0.1" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff85ae"/><stop offset="1" stop-color="#ea3a76"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="cl"><rect width="49.5" height="100"/></clipPath><clipPath id="cr"><rect x="50.5" width="49.5" height="100"/></clipPath>
    <path id="h" d="M50 90C22 70 4 53 4 33 4 18 15 7 29 7c9 0 17 5 21 13 4-8 12-13 21-13 14 0 25 11 25 26 0 20-18 37-46 57z"/>
  </defs>
  <g clip-path="url(#cl)"><use href="#h" fill="url(#l)"/><use href="#h" fill="url(#g)"/></g>
  <g clip-path="url(#cr)"><use href="#h" fill="url(#r)"/><use href="#h" fill="url(#g)"/></g>
</svg>
<div class="text">
  <h1>Вдвоём</h1>
  <p>Решаем вместе, когда увидимся и&nbsp;чем займёмся</p>
  <div class="chips">
    <span class="chip">🗓 Когда вы оба свободны</span>
    <span class="chip">🍿 Фильм и место свайпами</span>
    <span class="chip">🎁 Хотелки, планы, дела</span>
  </div>
</div>
